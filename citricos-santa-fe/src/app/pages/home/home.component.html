<app-header></app-header>

<main>
  <section>
    <div
      id="carouselIndicators"
      class="carousel slide"
      data-bs-ride="carousel"
      data-bs-interval="7000"
    >
      <div class="carousel-indicators">
        <button
          type="button"
          data-bs-target="#carouselIndicators"
          data-bs-slide-to="0"
          class="active"
          aria-current="true"
          aria-label="Slide 1"
        ></button>
        <button
          type="button"
          data-bs-target="#carouselIndicators"
          data-bs-slide-to="1"
          aria-label="Slide 2"
        ></button>
        <button
          type="button"
          data-bs-target="#carouselIndicators"
          data-bs-slide-to="2"
          aria-label="Slide 3"
        ></button>
      </div>
      <div class="carousel-inner">
        <div
          class="carousel-item"
          [ngClass]="{ active: i === 0 }"
          *ngFor="let image of images; let i = index"
        >
          <img [src]="image.url" class="d-block w-100" [alt]="image.alt" />
        </div>
      </div>
      <button
        class="carousel-control-prev opacity-50"
        type="button"
        data-bs-target="#carouselIndicators"
        data-bs-slide="prev"
      >
        <span class="" aria-hidden="true">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="currentColor"
            class="bi bi-arrow-left-circle-fill carousel-controls"
            viewBox="0 0 16 16"
          >
            <path
              d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0zm3.5 7.5a.5.5 0 0 1 0 1H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5H11.5z"
            />
          </svg>
        </span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button
        class="carousel-control-next opacity-50"
        type="button"
        data-bs-target="#carouselIndicators"
        data-bs-slide="next"
      >
        <span class="" aria-hidden="true">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="currentColor"
            class="bi bi-arrow-right-circle-fill carousel-controls"
            viewBox="0 0 16 16"
          >
            <path
              d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0zM4.5 7.5a.5.5 0 0 0 0 1h5.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3a.5.5 0 0 0 0-.708l-3-3a.5.5 0 1 0-.708.708L10.293 7.5H4.5z"
            />
          </svg>
        </span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>
  </section>

  <section class="bg-nosotros" [id]="idsSeccionesHomeEnum.SECCION_NOSOTRODS">
    <div class="container pt-5 pb-5">
      <div class="row">
        <div class="col-12 col-lg-4 d-flex-center">
          <img
            class="img-fluid h-320px h-sm-500px"
            src="assets/imgs/vaso-de-jugo.webp"
            [alt]="textosAlternativosEnum.VASO_JUGO_NARANJA"
            loading="lazy"
          />
        </div>
        <div class="col-12 col-lg-8">
          <div class="border-left-lg-gris-oscuro ps-lg-4">
            <div class="d-lg-flex text-center mb-3">
              <img
                class="mt-3 mt-lg-0 img-fluid"
                style="height: 4.81331rem"
                src="assets/imgs/citricos-color.svg"
                [alt]="textosAlternativosEnum.LOGO_CITRICOS"
              />
              <h1
                class="titulo anaranjado mt-3 mt-lg-0 ms-lg-4 line-height-2-5rem"
              >
                Nuestra <span class="d-lg-block">Historia</span>
              </h1>
            </div>

            <p class="parrafo" *ngFor="let parrafo of parrafos">
              {{ parrafo }}
            </p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="bg-contactenos" [id]="idsSeccionesHomeEnum.SECCION_CONTACTO">
    <div class="container">
      <div class="row">
        <div class="col-12 col-md-6 offset-md-6 mt-5">
          <h2 class="titulo text-center">Contáctenos</h2>
          <div
            class="d-sm-flex justify-content-center align-items-center text-center"
          >
            <span class="me-sm-3">santafecitricos@gmail.com</span>
            <hr class="d-none d-sm-flex hr-solid-black-15px" />
            <span class="ms-sm-3 d-block d-sm-flex mt-2 mt-sm-0"
              >Tel : 8820-1522</span
            >
          </div>

          <form
            [formGroup]="formContacto"
            class="mb-5"
            (ngSubmit)="submitForm()"
          >
            <div class="mb-3">
              <label for="nombrePersona" class="form-label texto-base"
                >Nombre</label
              >
              <input
                [ngClass]="{
                  'is-invalid':
                    formContacto.get('from_name')?.invalid &&
                    formContacto.get('from_name')?.touched &&
                    formContacto.get('from_name')?.dirty
                }"
                required
                type="text"
                class="form-control input-form"
                id="nombrePersona"
                aria-describedby="nombre persona"
                formControlName="from_name"
              />
              <div
                class="invalid-feedback rojo texto-base mt-3"
                *ngIf="
                  formContacto.get('from_name')?.invalid &&
                  formContacto.get('from_name')?.touched &&
                  formContacto.get('from_name')?.dirty
                "
              >
                {{ mensajesValidacionFormContactoEnum.NOMBRE_REQUERIDO }}
              </div>
            </div>
            <div class="mb-3">
              <label for="inputEmail" class="form-label texto-base"
                >Correo electrónico</label
              >
              <input
                [ngClass]="{
                  'is-invalid':
                    formContacto.get('email')?.invalid &&
                    formContacto.get('email')?.touched &&
                    formContacto.get('email')?.dirty
                }"
                required
                type="email"
                class="form-control input-form"
                id="inputEmail"
                formControlName="email"
              />
              <div
                class="invalid-feedback rojo texto-base mt-3"
                *ngIf="
                  formContacto.get('email')?.invalid &&
                  formContacto.get('email')?.touched &&
                  formContacto.get('email')?.dirty
                "
              >
                {{ mensajesValidacionFormContactoEnum.EMAIL_REQUERIDO }}
              </div>
            </div>
            <div class="mb-3">
              <label for="inputMensaje" class="form-label texto-base"
                >Mensaje</label
              >
              <textarea
                [ngClass]="{
                  'is-invalid':
                    formContacto.get('message')?.invalid &&
                    formContacto.get('message')?.touched &&
                    formContacto.get('message')?.dirty
                }"
                required
                class="form-control input-textarea-form"
                id="inputMensaje"
                rows="3"
                formControlName="message"
              ></textarea>
              <div
                class="invalid-feedback rojo texto-base mt-3"
                *ngIf="
                  formContacto.get('message')?.invalid &&
                  formContacto.get('message')?.touched &&
                  formContacto.get('message')?.dirty
                "
              >
                {{ mensajesValidacionFormContactoEnum.MENSAJE_REQUERIDO }}
              </div>
            </div>
            <div class="text-end">
              <button type="submit" class="btn btn-anaranjado-formulario">
                Enviar
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>
</main>

<app-footer></app-footer>
